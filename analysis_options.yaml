# This file configures the analyzer, which statically analyzes Dart code to
# check for errors, warnings, and lints.
#
# The issues identified by the analyzer are surfaced in the UI of Dart-enabled
# IDEs (https://dart.dev/tools#ides-and-editors). The analyzer can also be
# invoked from the command line by running `flutter analyze`.

# Activates Very Good Ventures' strict lint set for consistent, idiomatic Dart.
include: package:very_good_analysis/analysis_options.yaml

analyzer:
  # Generated build output copies lib sources into flutter_assets; never
  # analyze it.
  exclude:
    - build/**
    # Generated sources. They are rewritten from their inputs, so a lint
    # here can only be fixed by changing the generator or its configuration,
    # never by editing the file. The gen-l10n output ships an ignore header
    # of its own; build_runner output does not.
    - "**/*.g.dart"
    - lib/l10n/app_localizations*.dart

linter:
  # Project-specific overrides go here. Disable a rule with `rule: false` or
  # enable extra ones. Prefer inline `// ignore:` / `// ignore_for_file:` for
  # one-off exceptions instead of disabling project-wide.
  rules:

# Additional information about this file can be found at
# https://dart.dev/guides/language/analysis-options
