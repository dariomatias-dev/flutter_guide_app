name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Runs on its own rather than gating the others: a newly disclosed
  # advisory is not a reason to stop the tests from reporting.
  vulnerabilities:
    name: Vulnerabilities
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      # Reads pubspec.lock against the OSV database, which carries pub
      # advisories. The lockfile is what matters here: the caret ranges in
      # pubspec.yaml say what could resolve, not what actually ships.
      #
      # Pinned to an exact version, since upstream reserves the right to
      # change behaviour in a patch.
      - name: Scan the lockfiles
        uses: google/osv-scanner-action/osv-scanner-action@v2.5.1
        with:
          scan-args: |-
            --lockfile=pubspec.lock
            --lockfile=packages/app_ui/pubspec.lock

  app_ui:
    name: packages/app_ui
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: packages/app_ui
    steps:
      - uses: actions/checkout@v4

      - name: Read the Flutter version from .fvmrc
        id: fvm
        run: echo "version=$(jq -r .flutter ../../.fvmrc)" >> "$GITHUB_OUTPUT"

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ steps.fvm.outputs.version }}
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Check formatting
        run: dart format --output=none --set-exit-if-changed lib test

      - name: Analyze
        run: flutter analyze

      - name: Test
        run: flutter test --coverage

      - name: Check coverage
        run: ../../scripts/check_coverage.sh coverage/lcov.info 98

      # lcov paths are relative to the package root; Codecov matches them
      # against the repository, so they need the package prefix.
      - name: Rewrite coverage paths to be repository-relative
        run: sed -i 's|^SF:|SF:packages/app_ui/|' coverage/lcov.info

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v5
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: packages/app_ui/coverage/lcov.info
          flags: app_ui
          name: app_ui
          fail_ci_if_error: false

  app:
    name: flutter_guide
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      # FVM owns the SDK version. Repeating it here would let the two drift,
      # and the pipeline would keep building on a version nobody runs.
      - name: Read the Flutter version from .fvmrc
        id: fvm
        run: echo "version=$(jq -r .flutter .fvmrc)" >> "$GITHUB_OUTPUT"

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ steps.fvm.outputs.version }}
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get

      # The app declares .env as an asset and reads the ad unit ids from it.
      # The real values are secrets; the keys only have to exist.
      - name: Create the .env file
        run: |
          cat <<'EOF' > .env
          DEVICE_ID=
          BANNER_AD_ID=
          BANNER_AD_SAMPLE_ID=
          INTERSTICIAL_AD_SAMPLE_ID=
          REWARDED_AD_SAMPLE_ID=
          APP_OPEN_AD_SAMPLE_ID=
          EOF

      - name: Generate code
        run: dart run build_runner build --delete-conflicting-outputs

      - name: Generate localizations
        run: flutter gen-l10n

      - name: Verify the generated files are up to date
        run: |
          if [ -n "$(git status --porcelain -- 'lib/l10n/app_localizations*.dart' '**/*.g.dart')" ]; then
            echo "Generated output is out of date. Run 'dart run build_runner build' and 'fvm flutter gen-l10n' locally and commit the result." >&2
            git status --porcelain -- 'lib/l10n/app_localizations*.dart' '**/*.g.dart' >&2
            git diff -- 'lib/l10n/app_localizations*.dart' '**/*.g.dart' >&2
            exit 1
          fi

      - name: Check localizations
        run: ./scripts/check_l10n.sh

      - name: Check formatting
        run: dart format --output=none --set-exit-if-changed lib test integration_test

      - name: Analyze
        run: flutter analyze

      - name: Test
        run: flutter test --coverage

      - name: Check coverage
        run: ./scripts/check_coverage.sh coverage/lcov.info 95

      # Reporting only: check_coverage.sh above is what fails the build. A
      # fork cannot read the token, so an upload failure must not fail the job.
      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v5
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: coverage/lcov.info
          flags: app
          name: flutter_guide
          fail_ci_if_error: false

  build_apk:
    name: Build APK
    needs: app
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - name: Read the Flutter version from .fvmrc
        id: fvm
        run: echo "version=$(jq -r .flutter .fvmrc)" >> "$GITHUB_OUTPUT"

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ steps.fvm.outputs.version }}
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Create the .env file
        run: |
          cat <<'EOF' > .env
          DEVICE_ID=
          BANNER_AD_ID=
          BANNER_AD_SAMPLE_ID=
          INTERSTICIAL_AD_SAMPLE_ID=
          REWARDED_AD_SAMPLE_ID=
          APP_OPEN_AD_SAMPLE_ID=
          EOF

      - name: Generate code
        run: dart run build_runner build --delete-conflicting-outputs

      - name: Generate localizations
        run: flutter gen-l10n

      # No keystore in this checkout, so the build falls back to the debug
      # keys. It proves the Android build compiles; the artifact the Play
      # Store receives comes from the release workflow.
      - name: Build the release APK
        run: flutter build apk --release

      - uses: actions/upload-artifact@v4
        with:
          name: flutter_guide-release-apk
          path: build/app/outputs/flutter-apk/app-release.apk
          retention-days: 14

  # Boots the real app on a real Android system: dotenv, SharedPreferences,
  # the Riverpod graph and go_router all run for real here, none of it
  # faked, which is what a widget test structurally cannot do. Runs after
  # app passes rather than gating on it directly, since an emulator is by
  # far the slowest and flakiest step in the pipeline.
  integration:
    name: Integration tests
    needs: app
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Read the Flutter version from .fvmrc
        id: fvm
        run: echo "version=$(jq -r .flutter .fvmrc)" >> "$GITHUB_OUTPUT"

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ steps.fvm.outputs.version }}
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Create the .env file
        run: |
          cat <<'EOF' > .env
          DEVICE_ID=
          BANNER_AD_ID=
          BANNER_AD_SAMPLE_ID=
          INTERSTICIAL_AD_SAMPLE_ID=
          REWARDED_AD_SAMPLE_ID=
          APP_OPEN_AD_SAMPLE_ID=
          EOF

      - name: Generate code
        run: dart run build_runner build --delete-conflicting-outputs

      - name: Generate localizations
        run: flutter gen-l10n

      # A cold Android build downloads SDK platform 36 and compiles native
      # plugin sources, which alone can outrun the emulator session's own
      # budget. Doing it here, before the emulator boots, keeps that cost
      # off the timeout below.
      - name: Warm the Android build
        run: flutter build apk --debug

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' \
            | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Run integration tests
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          disable-animations: true
          cores: 4
          ram-size: 4096M
          heap-size: 1024M
          script: |
            timeout 480 flutter test integration_test/screenshot_test.dart -d emulator-5554
